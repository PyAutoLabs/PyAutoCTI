version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - libgsl-dev
  jobs:
    post_install:
      # arcticpy is a source-only C++ build; install numpy and Cython first,
      # then build without deps. 2.7 comes from a pinned GitHub commit until it
      # is on PyPI (PyAutoHeart#372), then `arcticpy==2.7`.
      - pip install "numpy>=2" "cython>=3"
      - pip install "arcticpy @ git+https://github.com/jkeger/arctic@6f5153582aca00b7b0cc11ab04b2c58a7502400d" --no-build-isolation --no-deps

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
